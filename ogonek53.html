      function sendVKJsonp(token, peerId, text) {
      return new Promise((resolve) => {
        if (!token || !peerId) { resolve(false); return; }
        const raw = String(peerId).trim().replace(/^(https?:\/\/)?(m\.)?(vk\.ru|vk\.com)\//i, '').replace(/\?.*$/, '').replace(/\/.*$/, '').replace(/^id/i, '');
        const sendWithNum = (numId) => {
          const cb = 'vkCb_' + Math.floor(Math.random() * 1000000);
          const s = document.createElement('script');
          const t = setTimeout(() => { resolve(false); }, 4500);
          window[cb] = (res) => { clearTimeout(t); resolve(Boolean(res && res.response !== undefined)); };
          s.src = 'https://api.vk.com/method/messages.send?user_id=' + encodeURIComponent(numId) + '&peer_id=' + encodeURIComponent(numId) + '&random_id=' + Math.floor(Math.random()*1e9) + '&message=' + encodeURIComponent(text) + '&access_token=' + encodeURIComponent(token.trim()) + '&v=5.199&callback=' + cb;
          s.onerror = () => { clearTimeout(t); resolve(false); };
          document.body.appendChild(s);
        };
        if (/^\d+$/.test(raw)) {
          sendWithNum(raw);
        } else {
          const cbR = 'vkRes_' + Math.floor(Math.random() * 1000000);
          const sR = document.createElement('script');
          window[cbR] = (r) => {
            if (r && r.response && r.response[0] && r.response[0].id) sendWithNum(String(r.response[0].id));
            else resolve(false);
          };

          sR.onerror = () => resolve(false);
          document.body.appendChild(sR);
        }
      });
    }

              <p class="text-sm sm:text-base lg:text-lg text-[#D4D4D8] max-w-xl mx-auto lg:mx-0 font-light">Авторские свечи ручной работы, созданные с любовью к деталям.</p>
              <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-center lg:justify-start gap-3 pt-2">
                <a href="#catalog" class="inline-flex items-center justify-center bg-[#D4A373] hover:bg-[#E6B88A] text-[#121214] px-8 py-4 rounded-full text-xs sm:text-sm font-semibold shadow-xl transition-all">Смотреть каталог →</a>
                <button onclick="toggleCart(true)" class="inline-flex items-center justify-center gap-2 bg-black/55 hover:bg-black/75 border border-white/20 px-7 py-4 rounded-full text-xs sm:text-sm font-medium text-[#F4F4F6]">
                  <span class="text-[#D4A373]">${VK_SVG}</span>
                  <span>Сделать заказ</span>
                </button>
              </div>
            </div>
            <div class="lg:col-span-5">
              <div onclick="openModal(${PRODUCTS[0].id})" class="cursor-pointer max-w-sm mx-auto lg:max-w-none rounded-3xl border border-white/20 bg-[#18181B]/85 backdrop-blur-xl p-3 sm:p-4 shadow-2xl group">
                <div class="relative rounded-2xl overflow-hidden aspect-[4/3.4] bg-[#121214]">
                  <img src="${PRODUCTS[0].image}" alt="${PRODUCTS[0].title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                  <span class="absolute top-3 left-3 bg-black/60 backdrop-blur-md border border-white/25 rounded-full px-3.5 py-1 text-[11px] text-white/95">${PRODUCTS[0].scentTag}</span>
                  <span class="absolute top-3 right-3 bg-[#D4A373] text-[#121214] rounded-full px-3 py-1 text-[10px] font-semibold uppercase tracking-wider">Берут чаще всего</span>
                </div>
                <div class="pt-4 px-1 flex items-center justify-between gap-3">
                  <div class="min-w-0">
                    <span class="text-[10px] uppercase tracking-[0.2em] text-[#A1A1AA] block">${PRODUCTS[0].codeName}</span>
                    <h3 class="font-serif-luxury text-xl sm:text-2xl font-semibold text-[#F4F4F6] group-hover:text-[#D4A373] truncate">${PRODUCTS[0].title}</h3>
                    <p class="text-xs text-[#A1A1AA] truncate mt-0.5">${PRODUCTS[0].shortDesc}</p>
                  </div>
                  <div class="text-right flex-shrink-0">
                    <span class="font-serif-luxury text-2xl font-bold text-[#F4F4F6] block leading-none">${formatPrice(PRODUCTS[0].price)}</span>
                    <span class="text-[11px] text-[#D4A373] mt-1 inline-block">Подробнее →</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section id="catalog" class="py-12 sm:py-20 max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex flex-col md:flex-row md:items-end justify-between mb-8 sm:mb-10 gap-5">
            <div>
              <span class="text-[11px] uppercase tracking-[0.2em] text-[#D4A373] font-medium">Коллекция ручной работы</span>
              <h2 class="font-serif-luxury text-3xl sm:text-5xl font-semibold text-[#F4F4F6] mt-1">Каталог свечей</h2>
            </div>
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5 w-full md:w-auto">
              <input id="search-input" type="text" value="${searchQuery}" oninput="handleSearch(this.value)" placeholder="Поиск свечи..." class="w-full sm:w-64 px-4 py-2.5 bg-[#18181B] border border-white/15 rounded-full text-xs sm:text-sm text-[#F4F4F6] placeholder-[#A1A1AA]/70 focus:outline-none focus:border-[#D4A373]" />
              <select onchange="handleSort(this.value)" class="bg-[#18181B] border border-white/15 rounded-full px-4 py-2.5 text-xs sm:text-sm text-[#F4F4F6] focus:outline-none focus:border-[#D4A373]">
                <option value="popular" ${sortBy === 'popular' ? 'selected' : ''}>По популярности</option>
                <option value="price-asc" ${sortBy === 'price-asc' ? 'selected' : ''}>Сначала дешевле</option>
                <option value="price-desc" ${sortBy === 'price-desc' ? 'selected' : ''}>Сначала дороже</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-7 items-stretch">
            ${list.map(p => `
              <div onclick="openModal(${p.id})" class="cursor-pointer bg-[#18181B] rounded-3xl border border-white/10 hover:border-[#D4A373]/50 shadow-xl transition-all flex flex-col justify-between h-full group relative">
                <div class="flex-1 flex flex-col">
                  <div class="relative aspect-[4/3] overflow-hidden rounded-t-3xl bg-[#1F1F23]">
                    <img src="${p.image}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                    <span class="absolute top-3.5 left-3.5 bg-black/60 backdrop-blur-md border border-white/25 text-white text-[11px] px-3.5 py-1 rounded-full">${p.scentTag}</span>
                    ${p.badge ? `<span class="absolute top-3.5 right-3.5 bg-[#D4A373] text-[#121214] text-[10px] font-semibold uppercase tracking-wider px-3 py-1 rounded-full">${p.badge}</span>` : ''}
                  </div>
                  <div class="p-5 sm:p-6 pb-4 flex-1 flex flex-col justify-between">
                    <div>
                      <div class="text-[10px] uppercase tracking-[0.22em] text-[#A1A1AA] mb-1">${p.codeName}</div>
                      <div class="flex items-center justify-between gap-2 flex-wrap relative">
                        <h3 class="font-serif-luxury text-2xl sm:text-3xl font-semibold text-[#F4F4F6] group-hover:text-[#D4A373] transition-colors">${p.title}</h3>
                        ${p.aromaOptions ? `
                          <button type="button" onclick="toggleTooltip(${p.id}, event)" class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-[#D4A373]/15 border border-[#D4A373]/50 text-[#E6B88A] text-xs font-medium">
                            <span>ⓘ Возможные ароматы</span>
                          </button>
                          ${tooltipOpenId === p.id ? `
                            <div onclick="event.stopPropagation()" class="w-full mt-2 p-3.5 rounded-2xl bg-[#121214] border border-[#D4A373]/60 shadow-2xl text-xs space-y-2">
                              <div class="text-[11px] uppercase tracking-wider text-[#D4A373] font-semibold">Возможные ароматы:</div>
                              ${p.aromaOptions.map(a => `
                                <div onclick="setAroma('${a.name}', event)" class="p-2 rounded-xl border cursor-pointer ${selectedAroma === a.name ? 'bg-[#D4A373]/20 border-[#D4A373] text-white' : 'bg-white/5 border-white/10 text-[#D4D4D8]'}">
                                  <div class="font-semibold">• ${a.name}</div>
                                  <div class="text-[11px] text-[#A1A1AA]">— ${a.desc}</div>
                                </div>
                              `).join('')}
                            </div>
                          ` : ''}
                        ` : ''}
                      </div>
                      <p class="text-xs sm:text-sm text-[#D4D4D8] mt-2.5 leading-relaxed font-light">${p.shortDesc}</p>
                    </div>
                    ${p.aromaOptions ? `
                      <div onclick="event.stopPropagation()" class="mt-4 pt-3 border-t border-white/10">
                        <span class="text-[11px] text-[#A1A1AA] block mb-2">Выберите аромат для заказа:</span>
                        <div class="flex flex-wrap gap-1.5">
                          ${p.aromaOptions.map(a => `
                            <button type="button" onclick="setAroma('${a.name}', event)" class="px-3 py-1 rounded-full text-[11px] border transition-all ${selectedAroma === a.name ? 'bg-[#D4A373] text-[#121214] border-[#D4A373] font-semibold' : 'bg-[#121214] text-[#D4D4D8] border-white/15'}">${a.name}</button>
                          `).join('')}
                        </div>
                      </div>
                    ` : ''}
                  </div>
                </div>
                <div class="px-5 sm:px-6 pb-5 sm:pb-6 pt-3 border-t border-white/10 flex items-center justify-between gap-2">
                  <div>
                    <span class="text-[10px] uppercase tracking-wider text-[#A1A1AA] block">Цена</span>
                    <span class="font-serif-luxury text-2xl sm:text-3xl font-bold text-[#F4F4F6] leading-none">${formatPrice(p.price)}</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <button type="button" onclick="event.stopPropagation(); openModal(${p.id})" class="px-3.5 py-2.5 rounded-full border border-white/15 hover:border-white/35 text-xs font-medium text-[#F4F4F6]">Подробнее</button>
                    <button type="button" onclick="event.stopPropagation(); addToCartById(${p.id}, 1)" class="px-4 py-2.5 rounded-full bg-[#D4A373] hover:bg-[#E6B88A] text-[#121214] text-xs font-semibold">В корзину</button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </section>

        <section id="reviews" class="py-12 sm:py-20 max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 border-t border-white/10">
          <div class="relative rounded-3xl overflow-hidden border border-white/15 bg-[#18181B] shadow-2xl">
            <div class="absolute inset-0 pointer-events-none">
              <img src="${KREMLIN_BG}" alt="" class="w-full h-full object-cover opacity-30 hero-kremlin-backdrop" />
              <div class="absolute inset-0 bg-gradient-to-t from-[#121214] via-[#121214]/80 to-[#121214]/65"></div>
            </div>
            <div class="relative z-10 p-6 sm:p-12 lg:p-14 text-center max-w-3xl mx-auto space-y-6">
              <div class="w-12 h-12 rounded-2xl bg-black/50 border border-white/20 flex items-center justify-center mx-auto text-[#D4A373]">${VK_SVG}</div>
              <div class="space-y-3">
                <span class="text-[11px] uppercase tracking-[0.2em] text-[#D4A373] font-medium">Сообщество и впечатления</span>
                <h2 class="font-serif-luxury text-3xl sm:text-4xl lg:text-5xl font-semibold text-[#F4F4F6]">Отзывы покупателей ВКонтакте</h2>
                <p class="text-xs sm:text-base text-[#D4D4D8] max-w-xl mx-auto font-light">Реальные фотографии наших свечей в интерьерах и отзывы покупателей собраны в обсуждениях нашей группы ВКонтакте.</p>
              </div>
              <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-center gap-3 pt-2">
                <a href="${VK_REVIEWS_URL}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 bg-[#D4A373] hover:bg-[#E6B88A] text-[#121214] px-7 py-4 rounded-full text-xs sm:text-sm font-semibold">${VK_SVG}<span>Читать отзывы в ВК</span></a>
                <a href="${VK_GROUP_URL}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 bg-black/55 hover:bg-black/75 border border-white/20 px-6 py-4 rounded-full text-xs sm:text-sm font-medium text-[#F4F4F6]">${VK_SVG}<span>Группа: vk.ru/ogonek53</span></a>
                <button onclick="toggleCart(true)" class="inline-flex items-center justify-center gap-2 bg-white/5 hover:bg-white/10 border border-white/15 px-6 py-4 rounded-full text-xs sm:text-sm font-medium text-[#F4F4F6]">${VK_SVG}<span>Сделать заказ</span></button>
              </div>
            </div>
          </div>
        </section>

        <footer class="bg-[#0E0E10] text-[#A1A1AA] py-10 border-t border-white/10">
          <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="text-center md:text-left">
              <div class="font-serif-luxury text-2xl font-bold text-[#F4F4F6]">Новгородский Огонёк</div>
              <p class="text-xs sm:text-sm text-[#A1A1AA] mt-1">Ароматические и фигурные свечи ручной работы в Великом Новгороде</p>
            </div>
            <div class="flex flex-wrap items-center justify-center gap-5 text-xs">
              <a href="#catalog" class="hover:text-white">Каталог</a>
              <a href="${VK_REVIEWS_URL}" target="_blank" rel="noopener noreferrer" class="hover:text-white">Отзывы</a>
              <button onclick="toggleCart(true)" class="hover:text-white">Сделать заказ</button>
              <a href="${VK_GROUP_URL}" target="_blank" rel="noopener noreferrer" class="text-[#D4A373] font-medium">ВКонтакте</a>
            </div>
          </div>
        </footer>

        ${modalProduct ? `
          <div onclick="closeModal()" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-6">
            <div onclick="event.stopPropagation()" class="bg-[#18181B] border-t sm:border border-white/15 rounded-t-3xl sm:rounded-3xl max-w-3xl w-full overflow-hidden shadow-2xl max-h-[92vh] flex flex-col md:flex-row">
              <div class="md:w-1/2 bg-[#121214] p-4 sm:p-6 relative">
                <div class="relative rounded-2xl overflow-hidden aspect-[4/3.3] sm:aspect-square bg-[#1F1F23]">
                  <img src="${modalProduct.image}" alt="${modalProduct.title}" class="w-full h-full object-cover" />
                  <span class="absolute top-3 left-3 bg-black/60 border border-white/20 text-white text-xs px-3.5 py-1 rounded-full">${modalProduct.scentTag}</span>
                </div>
              </div>
              <div class="md:w-1/2 p-5 sm:p-8 overflow-y-auto space-y-4 flex flex-col justify-between">
                <div class="space-y-3.5">
                  <div class="flex items-start justify-between gap-4">
                    <div>
                      <span class="text-[10px] uppercase tracking-[0.2em] text-[#D4A373] block">${modalProduct.codeName}</span>
                      <h2 class="font-serif-luxury text-2xl sm:text-3xl font-bold text-[#F4F4F6]">${modalProduct.title}</h2>
                    </div>
                    <button onclick="closeModal()" class="p-2 rounded-full bg-white/5 hover:bg-white/10 text-[#F4F4F6]">✕</button>
                  </div>
                  <div class="font-serif-luxury text-2xl sm:text-3xl font-bold text-[#D4A373]">${formatPrice(modalProduct.price)}</div>
                  <p class="text-xs sm:text-sm text-[#D4D4D8] leading-relaxed font-light">${modalProduct.fullDesc}</p>
                  ${modalProduct.aromaOptions ? `
                    <div class="bg-[#121214] p-3.5 rounded-2xl border border-white/10 space-y-2 text-xs">
                      <div class="font-medium text-[#D4A373]">Выберите аромат свечи:</div>
                      ${modalProduct.aromaOptions.map(a => `
                        <button type="button" onclick="setAroma('${a.name}', event)" class="w-full text-left p-2.5 rounded-xl border block ${selectedAroma === a.name ? 'bg-[#D4A373]/15 border-[#D4A373] text-[#F4F4F6]' : 'bg-[#18181B] border-white/10 text-[#A1A1AA]'}">
                          <div class="font-semibold text-[#F4F4F6]">${a.name}</div>
                          <div class="text-[11px] text-[#A1A1AA]">${a.desc}</div>
                        </button>
                      `).join('')}
                    </div>
                  ` : ''}
                  <div class="space-y-1.5 text-xs text-[#A1A1AA] border-y border-white/10 py-3">
                    <div>Состав: <span class="text-[#F4F4F6]">${modalProduct.material}</span></div>
                    <div>Особенности: <span class="text-[#F4F4F6]">${modalProduct.dimensions}</span></div>
                  </div>
                </div>
                <div class="space-y-2.5 pt-2">
                  <div class="flex items-center gap-2.5">
                    <div class="flex items-center border border-white/15 rounded-full bg-[#121214]">
                      <button onclick="changeModalQty(-1)" class="px-3.5 py-2.5 text-[#F4F4F6]">-</button>
                      <span class="px-2.5 text-sm font-semibold">${modalQty}</span>
                      <button onclick="changeModalQty(1)" class="px-3.5 py-2.5 text-[#F4F4F6]">+</button>
                    </div>
                    <button onclick="addToCartById(${modalProduct.id}, modalQty); closeModal(); toggleCart(true);" class="flex-1 bg-[#D4A373] hover:bg-[#E6B88A] text-[#121214] py-3.5 px-4 rounded-full text-xs sm:text-sm font-semibold">Оформить заказ • ${formatPrice(modalProduct.price * modalQty)}</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        ` : ''}

        ${cartOpen ? `
          <div onclick="toggleCart(false)" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex justify-end">
            <div onclick="event.stopPropagation()" class="w-full max-w-md bg-[#18181B] border-l border-white/15 h-full flex flex-col justify-between shadow-2xl">
              <div class="p-5 sm:p-6 border-b border-white/10 flex items-center justify-between bg-[#121214]">
                <div>
                  <h3 class="font-serif-luxury text-2xl font-bold text-[#F4F4F6]">Оформление заказа</h3>
                  <span class="text-[11px] text-[#A1A1AA]">Товаров в заказе: ${totalCount}</span>
                </div>
                <button onclick="toggleCart(false)" class="p-2 rounded-full hover:bg-white/10 text-[#A1A1AA]">✕</button>
              </div>
              <div class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4">
                ${orderSentSuccess ? `
                  <div class="p-6 rounded-3xl bg-[#121214] border border-emerald-500/40 text-center space-y-4 my-6">
                    <div class="w-14 h-14 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto text-2xl font-bold">✓</div>
                    <h4 class="font-serif-luxury text-3xl font-bold text-white">Заказ отправлен!</h4>
                    <p class="text-xs text-[#D4D4D8] leading-relaxed">Спасибо! Мы получили вашу заявку со списком свечей и свяжемся с вами в ближайшее время.</p>
                    <pre class="text-left text-[11px] text-[#A1A1AA] bg-[#18181B] p-3.5 rounded-2xl whitespace-pre-wrap font-sans">${orderSentSuccess.text}</pre>
                    <button onclick="toggleCart(false)" class="w-full py-3.5 rounded-full bg-[#D4A373] text-[#121214] text-xs font-semibold">Вернуться на сайт</button>
                  </div>
                ` : cart.length === 0 ? '<p class="text-xs text-[#A1A1AA] text-center py-16">Ваша корзина пока пуста</p>' : `
                  ${cart.map((c, i) => `
                    <div class="p-3.5 rounded-2xl bg-[#121214] border border-white/10 flex items-center gap-3.5">
                      <img src="${c.product.image}" class="w-16 h-16 rounded-xl object-cover flex-shrink-0" />
                      <div class="flex-1 min-w-0">
                        <div class="font-serif-luxury text-lg font-semibold truncate">${c.product.title}</div>
                        ${c.aroma ? `<div class="text-[11px] text-[#D4A373]">Аромат: ${c.aroma}</div>` : ''}
                        <div class="text-xs text-[#A1A1AA] mt-1">${formatPrice(c.product.price)} × ${c.qty} шт. = <strong class="text-white">${formatPrice(c.product.price * c.qty)}</strong></div>
                      </div>
                      <div class="flex items-center border border-white/15 rounded-full bg-[#18181B]">
                        <button onclick="changeQty(${i}, -1)" class="px-2.5 py-1 text-xs">-</button>
                        <span class="px-2 text-xs font-semibold">${c.qty}</span>
                        <button onclick="changeQty(${i}, 1)" class="px-2.5 py-1 text-xs">+</button>
                      </div>
                    </div>
                  `).join('')}
                  <div class="p-4 rounded-2xl bg-[#121214] border border-[#D4A373]/40 space-y-3">
                    <div class="text-xs font-semibold text-[#E6B88A]">Куда ответить по вашему заказу:</div>
                    <input type="text" value="${customerName}" oninput="customerName=this.value" placeholder="Ваше имя *" class="w-full px-3.5 py-2.5 rounded-xl bg-[#18181B] border border-white/15 text-xs text-white" />
                    <input type="text" value="${customerContact}" oninput="customerContact=this.value" placeholder="Телефон или ссылка на ваш ВК *" class="w-full px-3.5 py-2.5 rounded-xl bg-[#18181B] border border-white/15 text-xs text-white" />
                    <textarea rows="2" oninput="orderComment=this.value" placeholder="Комментарий к заказу (по желанию)..." class="w-full p-3 rounded-xl bg-[#18181B] border border-white/15 text-xs text-white resize-none">${orderComment}</textarea>
                  </div>
                `}
              </div>
              ${cart.length > 0 && !orderSentSuccess ? `
                <div class="p-5 sm:p-6 border-t border-white/10 bg-[#121214] space-y-3">
                  <div class="flex justify-between items-center">
                    <span class="text-xs uppercase tracking-wider text-[#A1A1AA]">Итого к оплате</span>
                    <span class="font-serif-luxury text-3xl font-bold text-[#D4A373]">${formatPrice(totalSum)}</span>
                  </div>
                  <button onclick="submitDirectOrder()" class="w-full py-4 rounded-full bg-[#D4A373] hover:bg-[#E6B88A] text-[#121214] text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 shadow-xl">
                    <span>Отправить заказ</span>
                  </button>
                </div>
              ` : ''}
            </div>
          </div>
        ` : ''}
      `;
    }
    render();
  </script>
</body>
</html>
